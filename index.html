<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Kurjeopardy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Anton&family=Libre+Franklin:wght@400;500;600&display=swap');

  :root{
    --jeop-blue:#060ce9;
    --jeop-deep:#070b87;
    --jeop-dark:#040627;
    --jeop-darker:#02031a;
    --gold:#d4a017;
    --gold-bright:#ffcc33;
    --gold-soft:#e8c468;
    --ink:#f4f1e8;
    --panel:#0b1150;
    --panel-lit:#141c6e;
    --line:rgba(212,160,23,.28);
    --green:#3fae6a;
    --red:#d9504a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--jeop-darker);
    font-family:'Libre Franklin',sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  #root{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
    background:
      radial-gradient(120% 60% at 50% 0%, #0a1170 0%, transparent 70%),
      linear-gradient(180deg,#050838 0%,#030420 60%,#02031a 100%);
    position:relative;}
  /* subtle grain */
  #root::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.04;z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:1;padding-bottom:24px;}

  /* ---------- header ---------- */
  header{padding:18px 18px 14px;text-align:center;position:relative;z-index:2;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(6,12,233,.22),transparent);}
  .wordmark{font-family:'Anton',sans-serif;letter-spacing:.5px;line-height:.9;
    font-size:clamp(30px,9vw,42px);text-transform:uppercase;}
  .wordmark .kur{color:var(--gold-bright);}
  .wordmark .jeop{color:#fff;text-shadow:2px 3px 0 #000,0 0 22px rgba(96,120,255,.5);}
  .tagline{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:3px;
    font-size:10px;color:var(--gold-soft);text-transform:uppercase;margin-top:5px;opacity:.85;}

  /* ---------- nav ---------- */
  nav{display:flex;border-top:1px solid var(--line);background:var(--jeop-darker);
    position:relative;z-index:3;}
  nav button{flex:1;background:none;border:none;padding:9px 2px 8px;cursor:pointer;
    font-family:'Oswald',sans-serif;font-weight:600;font-size:10px;letter-spacing:1px;
    text-transform:uppercase;color:#6b73b8;display:flex;flex-direction:column;
    align-items:center;gap:3px;transition:color .15s;}
  nav button svg{width:21px;height:21px;}
  nav button.on{color:var(--gold-bright);}
  nav button.on .ico{filter:drop-shadow(0 0 6px rgba(255,204,51,.6));}

  /* ---------- generic ---------- */
  .pad{padding:16px 16px 0;}
  .section-title{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:2px;
    text-transform:uppercase;font-size:13px;color:var(--gold-soft);margin:20px 4px 10px;
    display:flex;align-items:center;gap:8px;}
  .section-title::before{content:"";width:14px;height:2px;background:var(--gold);}

  .card{background:linear-gradient(160deg,var(--panel),var(--jeop-deep));
    border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);}

  /* ---------- segmented control ---------- */
  .seg{display:flex;background:var(--jeop-darker);border:1px solid var(--line);
    border-radius:11px;padding:3px;gap:3px;margin:4px;}
  .seg button{flex:1;background:none;border:none;border-radius:8px;padding:8px 4px;
    font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;letter-spacing:.6px;
    text-transform:uppercase;color:#7a82c4;cursor:pointer;transition:.15s;}
  .seg button.on{background:linear-gradient(180deg,var(--jeop-blue),var(--jeop-deep));
    color:var(--gold-bright);box-shadow:0 2px 8px rgba(6,12,233,.6);}

  /* ---------- leaderboard rows ---------- */
  .lb-row{display:flex;align-items:center;gap:12px;padding:11px 12px;
    border-bottom:1px solid rgba(212,160,23,.12);}
  .lb-row:last-child{border-bottom:none;}
  .rank{font-family:'Anton',sans-serif;font-size:19px;width:26px;text-align:center;
    color:#5b63a8;flex-shrink:0;}
  .rank.r1{color:var(--gold-bright);text-shadow:0 0 12px rgba(255,204,51,.7);}
  .rank.r2{color:#cdd2f0;}
  .rank.r3{color:#c8915a;}
  .avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;font-family:'Anton',sans-serif;
    font-size:16px;color:#fff;border:2px solid rgba(255,255,255,.18);}
  .lb-name{flex:1;min-width:0;}
  .lb-name .nm{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.4px;}
  .lb-name .sub{font-size:10.5px;color:#8088c8;margin-top:1px;}
  .lb-score{font-family:'Anton',sans-serif;font-size:22px;color:var(--gold-bright);
    flex-shrink:0;line-height:1;}
  .lb-score .u{font-size:10px;color:#8088c8;font-family:'Oswald',sans-serif;}
  .prov{font-size:9px;letter-spacing:.5px;color:#7a82c4;border:1px solid var(--line);
    border-radius:5px;padding:2px 5px;text-transform:uppercase;font-family:'Oswald',sans-serif;}

  /* city pills */
  .city-DC{background:linear-gradient(135deg,#c0392b,#7d2018);}
  .city-PG{background:linear-gradient(135deg,#27ae60,#176b3a);}
  .city-WK{background:linear-gradient(135deg,#2980b9,#174f73);}
  .citytag{font-family:'Oswald',sans-serif;font-weight:700;font-size:9px;
    padding:2px 6px;border-radius:5px;letter-spacing:.5px;color:#fff;}

  /* ---------- crown / today ---------- */
  .champ{background:
      radial-gradient(120% 100% at 50% 0%,rgba(255,204,51,.22),transparent 70%),
      linear-gradient(160deg,var(--panel-lit),var(--jeop-deep));
    border:1.5px solid var(--gold);border-radius:16px;padding:18px 14px;text-align:center;
    margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .champ .crown{font-size:30px;margin-bottom:2px;}
  .champ .lbl{font-family:'Oswald',sans-serif;letter-spacing:2px;font-size:10px;
    text-transform:uppercase;color:var(--gold-soft);}
  .champ .who{font-family:'Anton',sans-serif;font-size:34px;color:#fff;
    text-shadow:0 0 20px rgba(255,204,51,.5);margin:3px 0;}
  .champ .idx{font-family:'Oswald',sans-serif;font-weight:600;color:var(--gold-bright);font-size:14px;}

  /* ---------- score entry ---------- */
  .field-label{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:1px;
    font-size:11px;text-transform:uppercase;color:var(--gold-soft);margin:14px 4px 7px;}
  .player-pick{display:flex;flex-wrap:wrap;gap:7px;}
  .pp{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;
    padding:8px 13px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--jeop-darker);color:#9aa1d8;cursor:pointer;transition:.12s;}
  .pp.sel{background:linear-gradient(180deg,var(--jeop-blue),var(--jeop-deep));
    color:var(--gold-bright);border-color:var(--gold);}
  .score-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;
    background:var(--jeop-darker);border:1px solid var(--line);border-radius:11px;
    padding:9px 11px;}
  .score-row .nm{flex:1;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;}
  .stepper{display:flex;align-items:center;gap:0;}
  .stepper button{width:34px;height:34px;border:1px solid var(--line);
    background:var(--panel);color:var(--gold-bright);font-size:20px;font-family:'Anton',sans-serif;
    cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .stepper button:first-child{border-radius:8px 0 0 8px;}
  .stepper button:last-child{border-radius:0 8px 8px 0;}
  .stepper .val{width:46px;height:34px;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);background:var(--jeop-darker);
    font-family:'Anton',sans-serif;font-size:18px;color:#fff;text-align:center;
    display:flex;align-items:center;justify-content:center;}
  .big-btn{width:100%;padding:15px;border:none;border-radius:12px;cursor:pointer;
    font-family:'Anton',sans-serif;font-size:18px;letter-spacing:1px;text-transform:uppercase;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1a1200;
    box-shadow:0 6px 18px rgba(212,160,23,.4);margin-top:16px;}
  .big-btn:active{transform:translateY(1px);}
  .big-btn:disabled{opacity:.4;}
  .hint{font-size:11.5px;color:#8088c8;text-align:center;margin-top:9px;line-height:1.5;}
  .total-chip{text-align:center;font-family:'Oswald',sans-serif;font-weight:600;
    font-size:12px;color:var(--gold-soft);margin-top:6px;}
  .total-chip.bad{color:var(--red);}
  .date-in{background:var(--jeop-darker);border:1.5px solid var(--line);border-radius:9px;
    color:var(--ink);font-family:'Oswald',sans-serif;font-size:14px;padding:9px 11px;width:100%;}

  /* couch group divider in entry */
  .couch-box{border:1px dashed var(--line);border-radius:11px;padding:10px;margin-top:8px;}

  /* ---------- chat ---------- */
  .chat-wrap{display:flex;flex-direction:column;height:100%;}
  .chat-scroll{flex:1;overflow-y:auto;padding:14px 12px;display:flex;
    flex-direction:column;gap:9px;}
  .msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.4;}
  .msg .who{font-family:'Oswald',sans-serif;font-weight:700;font-size:10px;
    letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;opacity:.85;}
  .msg.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line);
    border-bottom-left-radius:4px;}
  .msg.me{align-self:flex-end;background:linear-gradient(160deg,var(--jeop-blue),var(--jeop-deep));
    border-bottom-right-radius:4px;}
  .msg img{border-radius:9px;max-width:100%;display:block;margin-top:3px;}
  .chat-input{display:flex;gap:7px;padding:9px 10px;border-top:1px solid var(--line);
    background:var(--jeop-darker);}
  .chat-input input{flex:1;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:10px 14px;color:var(--ink);font-size:14px;font-family:'Libre Franklin';}
  .chat-input button{border:none;border-radius:50%;width:40px;height:40px;flex-shrink:0;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1a1200;
    font-size:18px;cursor:pointer;}
  .gif-btn{background:var(--panel)!important;border:1px solid var(--line)!important;
    color:var(--gold-bright)!important;font-family:'Anton';font-size:12px!important;}
  .gif-tray{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--jeop-darker);
    border-top:1px solid var(--line);}
  .gif-tray img{height:62px;border-radius:7px;cursor:pointer;flex-shrink:0;}

  /* stat grid */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .stat{background:var(--jeop-darker);border:1px solid var(--line);border-radius:11px;
    padding:11px;text-align:center;}
  .stat .v{font-family:'Anton',sans-serif;font-size:26px;color:var(--gold-bright);}
  .stat .l{font-family:'Oswald',sans-serif;font-size:9.5px;letter-spacing:.8px;
    text-transform:uppercase;color:#8088c8;margin-top:2px;}

  .toast{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);
    background:var(--green);color:#fff;font-family:'Oswald',sans-serif;font-weight:600;
    padding:11px 20px;border-radius:24px;font-size:13px;z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.5);animation:pop .3s;}
  @keyframes pop{from{opacity:0;transform:translate(-50%,12px);}}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}}
  .fade{animation:fadein .35s both;}

  .empty{text-align:center;color:#8088c8;font-size:13px;padding:30px 20px;line-height:1.6;}
  .mini-bar{height:6px;border-radius:3px;background:var(--jeop-darker);overflow:hidden;margin-top:5px;}
  .mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));}

  /* mode toggle (Summary | Archive) */
  .mode-seg{margin:0 4px 2px;background:transparent;border:none;padding:0;gap:0;
    border-bottom:1px solid var(--line);border-radius:0;}
  .mode-seg button{border-radius:0;background:none;padding:10px 4px;
    border-bottom:2px solid transparent;font-size:12px;}
  .mode-seg button.on{background:none;color:var(--gold-bright);
    border-bottom:2px solid var(--gold);box-shadow:none;}

  /* archive rows */
  .arch-date{flex:1;min-width:0;font-family:'Oswald',sans-serif;font-weight:600;
    font-size:13px;color:var(--ink);letter-spacing:.3px;}
  .crown-sm{font-size:15px;flex-shrink:0;}
  .chev{color:#5b63a8;font-size:13px;flex-shrink:0;width:16px;text-align:center;
    transition:transform .2s;}
  .chev.up{transform:rotate(180deg);color:var(--gold-bright);}
  .arch-detail{background:var(--jeop-darker);border-radius:9px;margin:0 6px 8px;
    padding:6px 4px;animation:fadein .2s both;}
  .detail-row{display:flex;align-items:center;gap:8px;padding:6px 8px;
    border-bottom:1px solid rgba(212,160,23,.1);}
  .detail-row:last-child{border-bottom:none;}
  .dr-rank{font-family:'Anton',sans-serif;font-size:13px;color:#5b63a8;
    width:18px;text-align:center;flex-shrink:0;}
  .dr-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;flex:1;}
  .dr-sub{font-size:10px;color:#8088c8;}
  .dr-idx{font-family:'Anton',sans-serif;font-size:15px;color:var(--gold-bright);
    flex-shrink:0;min-width:30px;text-align:right;}
</style>

/* ============ MODEL ============ */
/* Pure-hindsight scoring. Everything is recomputed live from the FULL dataset.
   - Family curve: fitted decay for couch sizes 1-3, raw observed average 4+.
   - Player rating: avg of (score / curve-at-couch-size) over ALL their games.
   - Daily score (index): actual / (rating * curve-at-couch-size) * 100.
   No frozen results, no rolling windows: new data reshapes all of history. */
const CURVE = APP_DATA.c;
const SEASON_START = APP_DATA.s;

// family curve value at couch size n
function fc(n){
  if(n<=3) return CURVE.a/(1+CURVE.b*(n-1));
  const raw=CURVE.raw;
  if(raw[n]!=null) return raw[n];
  // interpolate / clamp for unseen sizes using observed 4+ points
  const ks=Object.keys(raw).map(Number).filter(k=>k>=4).sort((a,b)=>a-b);
  if(n<=ks[0]) return raw[ks[0]];
  if(n>=ks[ks.length-1]) return raw[ks[ks.length-1]];
  let lo=ks[0],hi=ks[ks.length-1];
  for(const k of ks){ if(k<=n) lo=k; }
  for(let i=ks.length-1;i>=0;i--){ if(ks[i]>=n) hi=ks[i]; }
  if(lo===hi) return raw[lo];
  const f=(n-lo)/(hi-lo);
  return raw[lo]+f*(raw[hi]-raw[lo]);
}

// build couch list from compact data
const COUCHES = APP_DATA.g.map((row,i)=>({
  id:i, date:row[0],
  size:row[1].length,
  players:row[1].map(p=>({name:p[0],city:p[1],score:p[2]}))
}));

const CITY_NAMES={DC:'Dawson Creek',PG:'Prince George',WK:'West Kelowna'};
const PLAYER_CITY={Jonny:'DC',Julia:'DC',Mom:'DC',Dad:'DC',Carmen:'DC',Beckett:'DC',
  Naomi:'PG',Stevie:'PG',Nate:'WK',Eberley:'WK',Kirsten:'WK',Helena:'WK',Kevin:'WK'};
const ALL_PLAYERS=['Jonny','Nate','Stevie','Naomi','Eberley','Kirsten','Julia',
  'Helena','Mom','Dad','Carmen','Beckett','Kevin'];
const MIN_GAMES=5;   // below this, a player's rating is flagged "new"

// player rating = avg of (score / curve) over ALL their games in the dataset.
// computed once over the whole COUCHES list (pure hindsight).
const RATINGS = (function(){
  const acc={};
  for(const c of COUCHES){
    for(const p of c.players){
      const e=fc(c.size);
      if(e<=0) continue;
      if(!acc[p.name]) acc[p.name]={sum:0,n:0};
      acc[p.name].sum+=p.score/e;
      acc[p.name].n++;
    }
  }
  const out={};
  for(const nm in acc) out[nm]={rating:acc[nm].sum/acc[nm].n,games:acc[nm].n};
  return out;
})();
function rating(name){
  const r=RATINGS[name];
  if(!r) return {rating:1,games:0,provisional:true};
  return {rating:r.rating,games:r.games,provisional:r.games<MIN_GAMES};
}

// daily index for every player-game on a given date.
// expected = player rating * family curve at that couch size.
// index = actual / expected * 100.  Pure hindsight: rating uses all data.
function dayResults(date,couches){
  const todays=couches.filter(c=>c.date===date);
  const out=[];
  for(const c of todays){
    for(const p of c.players){
      const r=rating(p.name);
      const expected=r.rating*fc(c.players.length);
      const index= expected>0 ? (p.score/expected)*100 : 100;
      out.push({name:p.name,city:p.city,score:p.score,size:c.players.length,
                expected,index,provisional:r.provisional,games:r.games});
    }
  }
  return out;
}


// aggregate index leaderboard over a date range
function rangeBoard(fromDate,toDate,couches){
  const ind={},city={};
  const dates=[...new Set(couches.map(c=>c.date))]
    .filter(d=>d>=fromDate&&d<=toDate).sort();
  for(const d of dates){
    const res=dayResults(d,couches);
    for(const r of res){
      if(!ind[r.name]) ind[r.name]={sum:0,n:0,prov:r.provisional};
      ind[r.name].sum+=r.index; ind[r.name].n++; ind[r.name].prov=r.provisional;
    }
    const byCity={};
    for(const r of res){(byCity[r.city]=byCity[r.city]||[]).push(r.index);}
    for(const c in byCity){
      const avg=byCity[c].reduce((a,b)=>a+b,0)/byCity[c].length;
      if(!city[c]) city[c]={sum:0,n:0};
      city[c].sum+=avg; city[c].n++;
    }
  }
  const indArr=Object.entries(ind).map(([nm,v])=>({name:nm,avg:v.sum/v.n,
    games:v.n,provisional:v.prov})).sort((a,b)=>b.avg-a.avg);
  const cityArr=Object.entries(city).map(([c,v])=>({city:c,avg:v.sum/v.n,days:v.n}))
    .sort((a,b)=>b.avg-a.avg);
  return {indArr,cityArr,dates};
}

// days-won tally
function daysWonTally(fromDate,couches){
  const dw={},cw={};
  const dates=[...new Set(couches.map(c=>c.date))].filter(d=>d>=fromDate).sort();
  for(const d of dates){
    const res=dayResults(d,couches).filter(r=>!r.provisional);
    if(!res.length) continue;
    const best=Math.max(...res.map(r=>r.index));
    const winners=res.filter(r=>Math.abs(r.index-best)<1e-6);
    winners.forEach(w=>dw[w.name]=(dw[w.name]||0)+1/winners.length);
    // city
    const byCity={};
    res.forEach(r=>(byCity[r.city]=byCity[r.city]||[]).push(r.index));
    const cAvg=Object.entries(byCity).map(([c,v])=>
      [c,v.reduce((a,b)=>a+b,0)/v.length]);
    const cBest=Math.max(...cAvg.map(x=>x[1]));
    const cWin=cAvg.filter(x=>Math.abs(x[1]-cBest)<1e-6);
    cWin.forEach(x=>cw[x[0]]=(cw[x[0]]||0)+1/cWin.length);
  }
  return {dw,cw};
}

/* ============ DATE BUCKET HELPERS ============ */
function weekKey(d){
  const dt=new Date(d+'T00:00:00');
  const day=(dt.getDay()+6)%7;            // Mon=0
  dt.setDate(dt.getDate()-day);
  return dt.toISOString().slice(0,10);
}
const monthKey=d=>d.slice(0,7);
const yearKey=d=>d.slice(0,4);

function periodLabel(gran,key){
  const MO=['January','February','March','April','May','June','July',
    'August','September','October','November','December'];
  if(gran==='day') return fmtDate(key);
  if(gran==='year') return key+' Season';
  if(gran==='month'){const p=key.split('-');return MO[+p[1]-1]+' '+p[0];}
  const start=new Date(key+'T00:00:00');
  const end=new Date(start);end.setDate(end.getDate()+6);
  const f=dt=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
    [dt.getMonth()]+' '+dt.getDate();
  return 'Week of '+f(start)+'–'+f(end);
}

/* ============ ARCHIVE (scrollable history) ============ */
function ArchiveBoard(){
  const [gran,setGran]=useState('day');
  const [scope,setScope]=useState('ind');
  const [open,setOpen]=useState(null);

  const periods=useMemo(()=>{
    const keyFn={day:d=>d,week:weekKey,month:monthKey,year:yearKey}[gran];
    const dates=[...new Set(COUCHES.map(c=>c.date))]
      .filter(d=>d>=SEASON_START).sort();
    const buckets={};
    for(const d of dates){
      const k=keyFn(d);
      (buckets[k]=buckets[k]||[]).push(d);
    }
    return Object.entries(buckets).sort((a,b)=>b[0].localeCompare(a[0]))
      .map(function(entry){
        const k=entry[0],ds=entry[1];
        const indAgg={},cityAgg={};
        for(const d of ds){
          const res=dayResults(d,COUCHES);
          for(const rr of res){
            if(!indAgg[rr.name]) indAgg[rr.name]={sum:0,n:0,prov:rr.provisional};
            indAgg[rr.name].sum+=rr.index;indAgg[rr.name].n++;
            indAgg[rr.name].prov=rr.provisional;
          }
          const byC={};
          res.forEach(rr=>{(byC[rr.city]=byC[rr.city]||[]).push(rr.index);});
          for(const c in byC){
            const a=byC[c].reduce((x,y)=>x+y,0)/byC[c].length;
            if(!cityAgg[c]) cityAgg[c]={sum:0,n:0};
            cityAgg[c].sum+=a;cityAgg[c].n++;
          }
        }
        const indRank=Object.entries(indAgg).map(function(e){
          return {name:e[0],avg:e[1].sum/e[1].n,games:e[1].n,prov:e[1].prov};})
          .sort((a,b)=>b.avg-a.avg);
        const cityRank=Object.entries(cityAgg).map(function(e){
          return {city:e[0],avg:e[1].sum/e[1].n};})
          .sort((a,b)=>b.avg-a.avg);
        return {key:k,dates:ds,indRank:indRank,cityRank:cityRank};
      });
  },[gran]);

  return (
    <React.Fragment>
      <div className="pad">
        <div className="seg">
          {['day','week','month','year'].map(g=>(
            <button key={g} className={gran===g?'on':''}
              onClick={()=>{setGran(g);setOpen(null);}}>
              {{day:'Day',week:'Week',month:'Month',year:'Year'}[g]}</button>))}
        </div>
        <div className="seg" style={{marginTop:6}}>
          <button className={scope==='ind'?'on':''} onClick={()=>setScope('ind')}>Players</button>
          <button className={scope==='city'?'on':''} onClick={()=>setScope('city')}>Cities</button>
        </div>
      </div>
      <div className="pad">
        <div className="section-title">
          {scope==='ind'?'Player':'City'} History — by {gran}
        </div>
        <div className="card" style={{padding:'2px'}}>
          {periods.map(function(p){
            const rank=scope==='ind'?p.indRank:p.cityRank;
            const win=rank[0];
            const isOpen=open===p.key;
            return (
              <div key={p.key}>
                <div className="lb-row" style={{cursor:'pointer'}}
                  onClick={()=>setOpen(isOpen?null:p.key)}>
                  <div className="arch-date">{periodLabel(gran,p.key)}</div>
                  {win &&
                    <React.Fragment>
                      <span className="crown-sm">🏆</span>
                      {scope==='ind'
                        ? <Avatar name={win.name} size={28}/>
                        : <div className={'avatar city-'+win.city}
                            style={{width:28,height:28,fontSize:11}}>{win.city}</div>}
                      <div className="lb-name">
                        <div className="nm" style={{fontSize:14}}>
                          {scope==='ind'?win.name:CITY_NAMES[win.city]}</div>
                        {scope==='ind' &&
                          <div className="sub"><CityTag city={PLAYER_CITY[win.name]}/></div>}
                      </div>
                      <div className="lb-score" style={{fontSize:18}}>
                        {Math.round(win.avg)}<span className="u"> idx</span></div>
                    </React.Fragment>}
                  <div className={'chev '+(isOpen?'up':'')}>▾</div>
                </div>
                {isOpen &&
                  <div className="arch-detail">
                    {gran==='day' && scope==='ind'
                      ? dayResults(p.key,COUCHES).sort((a,b)=>b.index-a.index)
                          .map(function(rr,i){return (
                          <div className="detail-row" key={rr.name+i}>
                            <span className="dr-rank">{i+1}</span>
                            <Avatar name={rr.name} size={24}/>
                            <span className="dr-name">{rr.name}</span>
                            <span className="dr-sub">{rr.score} pts · exp {rr.expected.toFixed(1)}</span>
                            <span className="dr-idx">{Math.round(rr.index)}</span>
                          </div>);})
                      : rank.map(function(rr,i){return (
                          <div className="detail-row" key={(rr.name||rr.city)+i}>
                            <span className="dr-rank">{i+1}</span>
                            {scope==='ind'
                              ? <Avatar name={rr.name} size={24}/>
                              : <div className={'avatar city-'+rr.city}
                                  style={{width:24,height:24,fontSize:9}}>{rr.city}</div>}
                            <span className="dr-name">
                              {scope==='ind'?rr.name:CITY_NAMES[rr.city]}</span>
                            <span className="dr-sub">avg index</span>
                            <span className="dr-idx">{Math.round(rr.avg)}</span>
                          </div>);})}
                  </div>}
              </div>
            );
          })}
          {periods.length===0 &&
            <div className="empty">No games recorded yet this season.</div>}
        </div>
        <div className="hint">
          Tap any {gran} to see the full ranking. Index = score vs. expectation;
          higher means a bigger over-performance.
        </div>
      </div>
    </React.Fragment>
  );
}

/* ============ TODAY VIEW ============ */
function TodayView(){
  const res=useMemo(()=>dayResults(LAST_DATE,COUCHES)
    .sort((a,b)=>b.index-a.index),[]);
  const eligible=res.filter(r=>!r.provisional);
  const winner=eligible[0];
  const tally=useMemo(()=>daysWonTally(SEASON_START,COUCHES),[]);
  const dwArr=Object.entries(tally.dw).map(([n,v])=>({name:n,wins:v}))
    .sort((a,b)=>b.wins-a.wins);
  const cwArr=Object.entries(tally.cw).map(([c,v])=>({city:c,wins:v}))
    .sort((a,b)=>b.wins-a.wins);

  return (
    <div className="scroll fade">
      <div className="pad">
        <div className="section-title">Latest Game Night · {fmtDate(LAST_DATE)}</div>
        {winner &&
          <div className="champ">
            <div className="crown">🏆</div>
            <div className="lbl">Winner of the Day</div>
            <div className="who">{winner.name}</div>
            <div className="idx">Index {Math.round(winner.index)} ·
              scored {winner.score}, expected {winner.expected.toFixed(1)}</div>
          </div>}

        <div className="card" style={{padding:'4px 2px'}}>
          {res.map((r,i)=>(
            <div className="lb-row" key={r.name+i}>
              <div className={`rank r${i+1}`}>{i+1}</div>
              <Avatar name={r.name}/>
              <div className="lb-name">
                <div className="nm">{r.name} {r.provisional &&
                  <span className="prov">new</span>}</div>
                <div className="sub">scored {r.score} · expected&nbsp;
                  {r.expected.toFixed(1)} · {r.size===1?'solo':r.size+'-couch'}</div>
              </div>
              <div className="lb-score">{Math.round(r.index)}
                <span className="u"> idx</span></div>
            </div>))}
        </div>
      </div>

      <div className="pad">
        <div className="section-title">2026 Season · Days Won</div>
        <div className="card" style={{padding:'4px 2px'}}>
          {dwArr.map((p,i)=>{
            const max=dwArr[0].wins;
            return (
            <div className="lb-row" key={p.name}>
              <div className={`rank r${i+1}`}>{i+1}</div>
              <Avatar name={p.name} size={32}/>
              <div className="lb-name">
                <div className="nm">{p.name}</div>
                <div className="mini-bar"><i style={{width:(p.wins/max*100)+'%'}}/></div>
              </div>
              <div className="lb-score">{p.wins%1?p.wins.toFixed(1):p.wins}
                <span className="u"> won</span></div>
            </div>);
          })}
        </div>

        <div className="section-title">2026 Season · City Days Won</div>
        <div className="card" style={{padding:'4px 2px'}}>
          {cwArr.map((c,i)=>{
            const max=cwArr[0].wins;
            return(
            <div className="lb-row" key={c.city}>
              <div className={`rank r${i+1}`}>{i+1}</div>
              <div className={`avatar city-${c.city}`} style={{width:32,height:32,
                fontSize:13}}>{c.city}</div>
              <div className="lb-name">
                <div className="nm">{CITY_NAMES[c.city]}</div>
                <div className="mini-bar"><i style={{width:(c.wins/max*100)+'%'}}/></div>
              </div>
              <div className="lb-score">{c.wins%1?c.wins.toFixed(1):c.wins}
                <span className="u"> won</span></div>
            </div>);
          })}
        </div>
        <div className="hint">Days Won counts each game night's top performer.
          Ties split. Players need {MIN_GAMES}+ recent games to be eligible.</div>
      </div>
    </div>
  );
}

/* ============ SCORE ENTRY ============ */
function EntryView({onSubmit}){
  const [date,setDate]=useState(LAST_DATE);
  const [couches,setCouches]=useState([{players:{}}]); // each: {playerName:score}
  const [picking,setPicking]=useState(0);

  function togglePlayer(ci,name){
    setCouches(cs=>cs.map((c,i)=>{
      if(i!==ci) return c;
      const p={...c.players};
      if(name in p) delete p[name]; else p[name]=0;
      return {players:p};
    }));
  }
  function setScore(ci,name,delta){
    setCouches(cs=>cs.map((c,i)=>{
      if(i!==ci) return c;
      const p={...c.players};
      p[name]=Math.max(0,Math.min(66,(p[name]||0)+delta));
      return {players:p};
    }));
  }
  const usedPlayers=new Set(couches.flatMap(c=>Object.keys(c.players)));

  const couchTotals=couches.map(c=>
    Object.values(c.players).reduce((a,b)=>a+b,0));
  const anyOver=couchTotals.some(t=>t>66);
  const anyEmpty=couches.some(c=>Object.keys(c.players).length===0);

  return (
    <div className="scroll fade">
      <div className="pad">
        <div className="field-label">Game Date</div>
        <input className="date-in" type="date" value={date}
          max={new Date().toISOString().slice(0,10)}
          onChange={e=>setDate(e.target.value)}/>

        {couches.map((couch,ci)=>(
          <div key={ci}>
            <div className="field-label" style={{display:'flex',
              justifyContent:'space-between'}}>
              <span>Couch {ci+1} — Who Played This Screen?</span>
              {couches.length>1 &&
                <span style={{color:'var(--red)',cursor:'pointer'}}
                  onClick={()=>setCouches(cs=>cs.filter((_,i)=>i!==ci))}>remove</span>}
            </div>
            <div className="couch-box">
              <div className="player-pick">
                {ALL_PLAYERS.map(name=>{
                  const sel=name in couch.players;
                  const takenElsewhere=usedPlayers.has(name)&&!sel;
                  return <button key={name}
                    className={`pp ${sel?'sel':''}`}
                    disabled={takenElsewhere}
                    style={takenElsewhere?{opacity:.25}:{}}
                    onClick={()=>togglePlayer(ci,name)}>{name}</button>;
                })}
              </div>
              {Object.keys(couch.players).length>0 &&
                <div style={{marginTop:12}}>
                  {Object.keys(couch.players).map(name=>(
                    <div className="score-row" key={name}>
                      <Avatar name={name} size={30}/>
                      <div className="nm">{name}</div>
                      <div className="stepper">
                        <button onClick={()=>setScore(ci,name,-1)}>–</button>
                        <div className="val">{couch.players[name]}</div>
                        <button onClick={()=>setScore(ci,name,1)}>+</button>
                      </div>
                    </div>))}
                  <div className={`total-chip ${couchTotals[ci]>66?'bad':''}`}>
                    Couch total: {couchTotals[ci]} / 66
                    {couchTotals[ci]>66 && ' — over the max!'}
                  </div>
                </div>}
            </div>
          </div>
        ))}

        <button className="pp" style={{width:'100%',marginTop:12,padding:11}}
          onClick={()=>setCouches(cs=>[...cs,{players:{}}])}>
          + Add Another Couch (different city / screen)
        </button>

        <button className="big-btn" disabled={anyOver||anyEmpty}
          onClick={()=>onSubmit(date,couches)}>
          Submit Game Night
        </button>
        <div className="hint">
          Add a separate couch for each screen being played — Dawson Creek,
          Prince George and West Kelowna are usually their own couches.
        </div>
      </div>
    </div>
  );
}

/* ============ CHAT ============ */
const SEED_CHAT=[
  {who:'Nate',me:false,text:'11 and 4 tonight. Brutal final.'},
  {who:'Jonny',me:true,text:'A and Dub 22 over here! 🥳'},
  {who:'Naomi',me:false,text:'Big dogg won again 🙄 13-6'},
  {who:'Nate',me:false,gif:'https://media.tenor.com/x8v1oNUOmg4AAAAC/love-it.gif'},
];
const GIFS=[
  'https://media.tenor.com/x8v1oNUOmg4AAAAC/love-it.gif',
  'https://media.tenor.com/gUiu1zyxfzYAAAAC/thumbs-up.gif',
  'https://media.tenor.com/NShE0_Nm9ksAAAAC/clapping.gif',
  'https://media.tenor.com/bI1JZcaJYIYAAAAC/mind-blown.gif',
];
function ChatView(){
  const [msgs,setMsgs]=useState(SEED_CHAT);
  const [txt,setTxt]=useState('');
  const [tray,setTray]=useState(false);
  const endRef=useRef();
  useEffect(()=>{endRef.current&&endRef.current.scrollIntoView();},[msgs]);
  function send(){
    if(!txt.trim()) return;
    setMsgs(m=>[...m,{who:'Jonny',me:true,text:txt.trim()}]);
    setTxt('');
  }
  function sendGif(url){
    setMsgs(m=>[...m,{who:'Jonny',me:true,gif:url}]);
    setTray(false);
  }
  return (
    <div className="chat-wrap fade">
      <div className="chat-scroll">
        {msgs.map((m,i)=>(
          <div className={`msg ${m.me?'me':'them'}`} key={i}>
            {!m.me && <div className="who" style={{color:AV_COLORS[m.who]}}>{m.who}</div>}
            {m.text && <div>{m.text}</div>}
            {m.gif && <img src={m.gif} alt="gif"/>}
          </div>))}
        <div ref={endRef}/>
      </div>
      {tray &&
        <div className="gif-tray">
          {GIFS.map(g=><img key={g} src={g} onClick={()=>sendGif(g)} alt="gif"/>)}
        </div>}
      <div className="chat-input">
        <button className="gif-btn" onClick={()=>setTray(t=>!t)}>GIF</button>
        <input value={txt} placeholder="Message the family…"
          onChange={e=>setTxt(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&send()}/>
        <button onClick={send}>➤</button>
      </div>
    </div>
  );
}

/* ============ APP SHELL ============ */
function App(){
  const [tab,setTab]=useState('today');
  const [toast,setToast]=useState('');
  function handleSubmit(date,couches){
    const n=couches.reduce((s,c)=>s+Object.keys(c.players).length,0);
    setToast(`Logged ${n} score${n>1?'s':''} for ${fmtDate(date)} ✓`);
    setTimeout(()=>setToast(''),2600);
    setTab('today');
  }
  return (
    <React.Fragment>
      <header>
        <div className="wordmark"><span className="kur">KUR</span><span className="jeop">JEOPARDY</span></div>
        <div className="tagline">The Kurjata Family League</div>
      </header>

      {tab==='today' && <TodayView/>}
      {tab==='board' && <LeaderboardView/>}
      {tab==='entry' && <EntryView onSubmit={handleSubmit}/>}
      {tab==='chat'  && <ChatView/>}

      {toast && <div className="toast">{toast}</div>}

      <nav>
        <button className={tab==='today'?'on':''} onClick={()=>setTab('today')}>
          {Ico.trophy}<span>Today</span></button>
        <button className={tab==='board'?'on':''} onClick={()=>setTab('board')}>
          {Ico.chart}<span>Standings</span></button>
        <button className={tab==='entry'?'on':''} onClick={()=>setTab('entry')}>
          {Ico.plus}<span>Add Scores</span></button>
        <button className={tab==='chat'?'on':''} onClick={()=>setTab('chat')}>
          {Ico.chat}<span>Chat</span></button>
      </nav>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
